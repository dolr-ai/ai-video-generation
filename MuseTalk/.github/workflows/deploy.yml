name: Deploy MuseTalk to Fly.io

on:
  # Trigger on push to main branch
  push:
    branches: [ talking-head ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy.yml'

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy MuseTalk API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (for flyctl)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Check Fly.io authentication
      run: |
        echo "Checking Fly.io authentication..."
        flyctl auth whoami

    - name: Create app if it doesn't exist
      run: |
        cd MuseTalk
        if ! flyctl apps list | grep -q "musetalk-api"; then
          echo "Creating new Fly app..."
          flyctl apps create musetalk-api --org personal
        else
          echo "App musetalk-api already exists"
        fi

    - name: Create persistent volumes
      run: |
        cd MuseTalk
        echo "Setting up persistent volumes..."

        # Create models volume if it doesn't exist
        if ! flyctl volumes list --app musetalk-api | grep -q "musetalk_models"; then
          echo "Creating models volume (100GB)..."
          flyctl volumes create musetalk_models --size 100 --region ord --app musetalk-api
        else
          echo "Models volume already exists"
        fi

        # Create storage volume if it doesn't exist
        if ! flyctl volumes list --app musetalk-api | grep -q "musetalk_storage"; then
          echo "Creating storage volume (50GB)..."
          flyctl volumes create musetalk_storage --size 50 --region ord --app musetalk-api
        else
          echo "Storage volume already exists"
        fi

    - name: Deploy to Fly.io
      run: |
        cd MuseTalk
        echo "Deploying MuseTalk to Fly.io..."
        flyctl deploy --config fly/fly.toml --app musetalk-api --ha=false

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 30  # Wait for deployment to complete

        # Get app URL
        APP_URL=$(flyctl info --app musetalk-api --json | jq -r '.Hostname')

        if [ "$APP_URL" != "null" ] && [ ! -z "$APP_URL" ]; then
          echo "App URL: https://$APP_URL"

          # Check health endpoint (retry up to 5 times)
          for i in {1..5}; do
            if curl -f -s "https://$APP_URL/api/v1/health"; then
              echo "✅ Health check passed!"
              break
            else
              echo "Health check attempt $i failed, retrying in 30s..."
              sleep 30
            fi

            if [ $i -eq 5 ]; then
              echo "❌ Health check failed after 5 attempts"
              exit 1
            fi
          done
        else
          echo "Unable to get app URL"
          exit 1
        fi

    - name: Post deployment info
      if: success()
      run: |
        cd MuseTalk
        APP_URL=$(flyctl info --app musetalk-api --json | jq -r '.Hostname')

        echo "=========================================="
        echo "🚀 MuseTalk API deployed successfully!"
        echo "=========================================="
        echo "API URL: https://$APP_URL"
        echo "Health: https://$APP_URL/api/v1/health"
        echo "Docs: https://$APP_URL/docs"
        echo ""
        echo "To monitor:"
        echo "  flyctl logs --app musetalk-api"
        echo "  flyctl status --app musetalk-api"
        echo "=========================================="

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo "You can also check:"
        echo "  flyctl logs --app musetalk-api"
        echo "  flyctl status --app musetalk-api"