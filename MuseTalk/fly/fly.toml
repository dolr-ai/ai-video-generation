# Minimal fly.toml - app name and region specified in deploy command

[env]
  PYTHONUNBUFFERED = "1"
  NVIDIA_VISIBLE_DEVICES = "all"
  NVIDIA_DRIVER_CAPABILITIES = "compute,utility"

# Process handling
kill_signal = "SIGTERM"
kill_timeout = "300s"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "a10"
  memory = "16gb"
  cpus = 4

[[mounts]]
  source = "musetalk_models"
  destination = "/workspace/ai-video-generation/MuseTalk/models"