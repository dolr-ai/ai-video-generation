# Minimal fly.toml - app name and region specified in deploy command

[env]
  PYTHONUNBUFFERED = "1"
  NVIDIA_VISIBLE_DEVICES = "all"
  NVIDIA_DRIVER_CAPABILITIES = "compute,utility"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  size = "a10"
  memory = "16gb"
  cpus = 4

[[mounts]]
  source = "musetalk_models"
  destination = "/workspace/ai-video-generation/MuseTalk/models"