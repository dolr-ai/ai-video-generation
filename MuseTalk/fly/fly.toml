# fly.toml configuration for MuseTalk FastAPI Server
# Single GPU-enabled machine running both servers

app = 'talking-head-api'
primary_region = 'iad'  # Washington DC - try different region
kill_signal = 'SIGINT'
kill_timeout = 30

[build]
  dockerfile = 'Dockerfile'
  buildpacks = []

[env]
  # Python environment
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  
  # NVIDIA settings - allow access to all GPUs
  NVIDIA_VISIBLE_DEVICES = "all"
  NVIDIA_DRIVER_CAPABILITIES = "compute,utility"

[experimental]
  auto_rollback = true

# Single service configuration - only expose handler server (port 8000)
# Model server (8001) runs internally and is accessed by handler via localhost
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = false

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "300s"
    method = "GET"
    path = "/api/v1/health"

# Machine configuration with GPU
[[vm]]
  size = "l40s"  # GPU machine with L40S - more powerful than A10
  memory = "16gb"
  cpus = 4
  
# No persistent volumes - ephemeral storage only
# [[mounts]]
#   source = "musetalk_models"
#   destination = "/workspace/ai-video-generation/MuseTalk/persistent"

# Fly.io metrics
[metrics]
  port = 9091
  path = "/metrics"