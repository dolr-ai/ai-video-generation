# Minimal fly.toml - app name and region specified in deploy command

[env]
  PYTHONUNBUFFERED = "1"
  NVIDIA_VISIBLE_DEVICES = "all"
  NVIDIA_DRIVER_CAPABILITIES = "compute,utility"
  FLY_MACHINES_AUTO_STOP_IDLE_TIME = "900"  # 15 minutes in seconds

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service]]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  
  [http_service.machine_check]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[http_service.concurrency]
  type = "requests"
  hard_limit = 25
  soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  size = "a10"
  memory = "16gb"
  cpus = 4

[[mounts]]
  source = "musetalk_models"
  destination = "/workspace/ai-video-generation/MuseTalk/models"