name: Download and Upload Models to GCS

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'GCS bucket name for models (optional - uses secret if not provided)'
        required: false
        default: 'talking-head-models'
        type: string
      

env:
  GCS_BUCKET: ${{ secrets.GCS_BUCKET || github.event.inputs.bucket_name || 'talking-head-models' }}
  GCP_REGION: us-central1

jobs:
  download-and-upload-models:
    name: Download Models and Upload to GCS
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install huggingface_hub[cli] gdown
    
    # Authenticate to Google Cloud using service account key
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Verify GCS bucket access
      run: |
        BUCKET_NAME="${{ env.GCS_BUCKET }}"
        echo "Verifying access to bucket gs://${BUCKET_NAME}..."
        gsutil ls -b "gs://${BUCKET_NAME}" || {
          echo "❌ Cannot access bucket gs://${BUCKET_NAME}"
          echo "Please ensure the bucket exists and service account has access"
          exit 1
        }
        echo "✅ Bucket access verified"
    
    - name: Download MuseTalk models
      run: |
        mkdir -p models/musetalk models/musetalkV15 models/syncnet models/dwpose models/face-parse-bisent models/sd-vae models/whisper
        
        # Download MuseTalk V1.0 weights
        hf download TMElyralab/MuseTalk \
          --local-dir models \
          --include "musetalk/musetalk.json" "musetalk/pytorch_model.bin"
        
        echo "✅ Downloaded MuseTalk V1.0 models"
        ls -lh models/musetalk/ || true
    
    - name: Download MuseTalk V1.5 models
      run: |
        # Download MuseTalk V1.5 weights (unet.pth)
        hf download TMElyralab/MuseTalk \
          --local-dir models \
          --include "musetalkV15/musetalk.json" "musetalkV15/unet.pth"
        
        echo "✅ Downloaded MuseTalk V1.5 models"
        ls -lh models/musetalkV15/ || true
    
    - name: Download SyncNet model
      run: |
        # Download SyncNet weights
        hf download ByteDance/LatentSync \
          --local-dir models/syncnet \
          --include "latentsync_syncnet.pt"
        
        echo "✅ Downloaded SyncNet model"
        ls -lh models/syncnet/ || true
    
    - name: Download DWPose models
      run: |
        # Download DWPose weights
        hf download yzd-v/DWPose \
          --local-dir models/dwpose \
          --include "dw-ll_ucoco_384.pth"
        
        echo "✅ Downloaded DWPose models"
        ls -lh models/dwpose/ || true
    
    - name: Download Face Parsing model
      run: |
        mkdir -p models/face-parse-bisent
        
        # Download Face Parse Bisent weights (using gdown as in original script)
        gdown --id 154JgKpzCPW82qINcVieuPH3fZ2e0P812 -O models/face-parse-bisent/79999_iter.pth
        
        # Download resnet18 if not present
        curl -L https://download.pytorch.org/models/resnet18-5c106cde.pth \
          -o models/face-parse-bisent/resnet18-5c106cde.pth
        
        echo "✅ Downloaded Face Parsing model"
        ls -lh models/face-parse-bisent/ || true
    
    - name: Download SD-VAE and Whisper models
      run: |
        # Download SD VAE weights
        hf download stabilityai/sd-vae-ft-mse \
          --local-dir models/sd-vae \
          --include "config.json" "diffusion_pytorch_model.bin"
        
        # Download Whisper weights
        hf download openai/whisper-tiny \
          --local-dir models/whisper \
          --include "config.json" "pytorch_model.bin" "preprocessor_config.json"
        
        echo "✅ Downloaded SD-VAE and Whisper models"
        ls -lh models/sd-vae/ || true
        ls -lh models/whisper/ || true
    
    - name: Calculate model checksums
      run: |
        echo "Calculating checksums for all models..."
        find models -type f -exec sha256sum {} \; > model_checksums.txt
        echo "✅ Checksums calculated"
        cat model_checksums.txt
    
    - name: Upload models to GCS
      run: |
        BUCKET_NAME="${{ env.GCS_BUCKET }}"
        echo "Uploading models to gs://${BUCKET_NAME}/models/"
        
        # Upload with parallel transfers for speed
        gsutil -m -o "GSUtil:parallel_thread_count=10" \
          -o "GSUtil:parallel_process_count=4" \
          cp -r models/* "gs://${BUCKET_NAME}/models/"
        
        # Upload checksums
        gsutil cp model_checksums.txt "gs://${BUCKET_NAME}/"
        
        echo "✅ Models uploaded successfully"
        
        # List uploaded files
        echo "Uploaded files:"
        gsutil ls -lh "gs://${BUCKET_NAME}/models/**"
    
    - name: Create model metadata
      run: |
        cat > model_metadata.json << EOF
        {
          "version": "1.0.0",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${GITHUB_SHA}",
          "models": {
            "musetalk": {
              "version": "1.0",
              "files": ["pytorch_model.bin", "config.json"]
            },
            "musetalkV15": {
              "version": "1.5",
              "files": ["pytorch_model.bin", "config.json"]
            },
            "syncnet": {
              "version": "2.0",
              "files": ["syncnet_v2.model"]
            },
            "dwpose": {
              "version": "1.0",
              "files": ["dw-ll_ucoco_384.onnx", "yolox_l.onnx"]
            },
            "face-parse-bisent": {
              "version": "1.0",
              "files": ["79999_iter.pth"]
            },
            "sd-vae": {
              "version": "ft-mse",
              "files": ["diffusion_pytorch_model.bin", "config.json"]
            },
            "whisper": {
              "version": "base",
              "files": ["pytorch_model.bin"]
            }
          },
          "gcs_bucket": "${{ env.GCS_BUCKET }}",
          "gcs_path": "gs://${{ env.GCS_BUCKET }}/models/"
        }
        EOF
        
        # Upload metadata
        BUCKET_NAME="${{ env.GCS_BUCKET }}"
        gsutil cp model_metadata.json "gs://${BUCKET_NAME}/"
        
        echo "✅ Model metadata uploaded"
    
    - name: Generate RunPod volume instructions
      run: |
        cat > runpod_volume_setup.md << EOF
        # RunPod Volume Setup Instructions
        
        ## Model Storage Information
        - **GCS Bucket**: \`gs://${{ env.GCS_BUCKET }}\`
        - **Total Models**: $(find models -type f | wc -l) files
        - **Upload Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        ## Setting up RunPod Volume
        
        ### Option 1: Using RunPod Network Volume
        1. Create a new network volume in RunPod
        2. SSH into a GPU pod with the volume mounted
        3. Download models from GCS:
        \`\`\`bash
        # Install gsutil
        apt-get update && apt-get install -y google-cloud-sdk
        
        # Authenticate (use service account key or workload identity)
        gcloud auth activate-service-account --key-file=/path/to/key.json
        
        # Download models to volume
        gsutil -m cp -r gs://${{ env.GCS_BUCKET }}/models/* /workspace/models/
        \`\`\`
        
        ### Option 2: Using RunPod Cloud Sync
        1. Configure Cloud Sync in RunPod to sync from GCS
        2. Set source: \`gs://${{ env.GCS_BUCKET }}/models\`
        3. Set destination: \`/workspace/models\`
        
        ### Option 3: Direct Mount (if supported)
        Configure GCS FUSE in your container:
        \`\`\`bash
        # In your Dockerfile or startup script
        gcsfuse --implicit-dirs ${{ env.GCS_BUCKET }} /workspace/models
        \`\`\`
        
        ## Verifying Models
        After setup, verify all models are present:
        \`\`\`bash
        ls -la /workspace/models/
        # Should see: musetalk, musetalkV15, syncnet, dwpose, face-parse-bisent, sd-vae, whisper
        \`\`\`
        
        ## Using with Docker
        When running the container, mount the volume:
        \`\`\`bash
        docker run -v /path/to/models:/workspace/models ...
        \`\`\`
        EOF
        
        cat runpod_volume_setup.md
    
    - name: Upload setup instructions as artifact
      uses: actions/upload-artifact@v4
      with:
        name: model-setup-${{ github.sha }}
        path: |
          model_checksums.txt
          model_metadata.json
          runpod_volume_setup.md
        retention-days: 90
    
    - name: Summary
      run: |
        echo "## 📦 Model Upload Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Storage Location" >> $GITHUB_STEP_SUMMARY
        echo "- **GCS Bucket**: \`gs://${{ env.GCS_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Models Path**: \`gs://${{ env.GCS_BUCKET }}/models/\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Models Uploaded" >> $GITHUB_STEP_SUMMARY
        echo "- MuseTalk (v1.0 and v1.5)" >> $GITHUB_STEP_SUMMARY
        echo "- SyncNet v2" >> $GITHUB_STEP_SUMMARY
        echo "- DWPose" >> $GITHUB_STEP_SUMMARY
        echo "- Face Parsing BiSeNet" >> $GITHUB_STEP_SUMMARY
        echo "- SD-VAE" >> $GITHUB_STEP_SUMMARY
        echo "- Whisper Base" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Configure RunPod volume to sync from GCS" >> $GITHUB_STEP_SUMMARY
        echo "2. Mount volume at \`/workspace/models\` in your container" >> $GITHUB_STEP_SUMMARY
        echo "3. Deploy using the Docker image from GAR" >> $GITHUB_STEP_SUMMARY