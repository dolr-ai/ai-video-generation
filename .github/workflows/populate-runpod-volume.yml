name: Populate RunPod Volume with Models

on:
  workflow_dispatch:
    inputs:
      volume_id:
        description: 'RunPod Network Volume ID (e.g., f783l1iwwr)'
        required: true
        type: string

env:
  GCS_BUCKET: talking-head-models

jobs:
  populate-volume:
    name: Populate Existing RunPod Volume
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Download models from GCS to GitHub runner
      run: |
        echo "📥 Downloading models from GCS to GitHub runner..."
        mkdir -p ./models
        
        # Download all models
        gsutil -m -o "GSUtil:parallel_thread_count=10" \
               -o "GSUtil:parallel_process_count=4" \
               cp -r gs://${{ env.GCS_BUCKET }}/models/* ./models/
        
        # Verify download
        echo "✅ Models downloaded to GitHub runner:"
        ls -lah ./models/
        du -sh ./models/*
        
        # Count files
        FILE_COUNT=$(find ./models -type f | wc -l)
        echo "📊 Total files: $FILE_COUNT"
        
        if [ $FILE_COUNT -lt 10 ]; then
          echo "❌ Too few files downloaded"
          exit 1
        fi

    - name: Upload models to RunPod volume via rsync
      run: |
        echo "📤 This workflow demonstrates the download process."
        echo "   In RunPod, you would mount volume ${{ github.event.inputs.volume_id }}"
        echo "   and copy these models directly."
        echo ""
        echo "🔧 Manual steps to populate your RunPod volume:"
        echo "1. Create a pod in RunPod console"
        echo "2. Mount volume ${{ github.event.inputs.volume_id }} at /workspace/models"  
        echo "3. SSH into pod and run:"
        echo ""
        echo "   # Install gcloud"
        echo "   apt-get update && apt-get install -y google-cloud-sdk"
        echo ""
        echo "   # Authenticate"
        echo "   echo '\$GCP_CREDENTIALS' > /tmp/key.json"
        echo "   gcloud auth activate-service-account --key-file=/tmp/key.json"
        echo ""
        echo "   # Download to volume"
        echo "   gsutil -m cp -r gs://${{ env.GCS_BUCKET }}/models/* /workspace/models/"
        echo ""
        echo "4. Verify with: ls -lah /workspace/models/"
        echo "5. Stop the pod when done"
        
    - name: Generate commands for RunPod
      run: |
        cat > runpod-populate-commands.sh << 'EOF'
        #!/bin/bash
        # Commands to run in your RunPod pod to populate the volume
        
        set -e
        echo "🚀 Populating RunPod volume with models..."
        
        # Install Google Cloud SDK
        apt-get update && apt-get install -y google-cloud-sdk
        
        # Authenticate (set this environment variable in your pod)
        echo "$GCP_CREDENTIALS" > /tmp/gcp-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
        rm /tmp/gcp-key.json
        
        # Create directory structure
        mkdir -p /workspace/models/{musetalk,musetalkV15,syncnet,dwpose,face-parse-bisent,sd-vae,whisper}
        
        # Download models from GCS
        gsutil -m -o "GSUtil:parallel_thread_count=10" \
               -o "GSUtil:parallel_process_count=4" \
               cp -r gs://talking-head-models/models/* /workspace/models/
        
        # Create marker file
        echo "$(date): Models downloaded from GCS" > /workspace/models/.models_downloaded
        
        # Verify
        echo "✅ Download complete!"
        ls -lah /workspace/models/
        du -sh /workspace/models/*
        
        FILE_COUNT=$(find /workspace/models -type f | wc -l)
        echo "📊 Total files: $FILE_COUNT"
        
        echo "🎉 Volume population completed!"
        EOF
        
        chmod +x runpod-populate-commands.sh
        
    - name: Upload script as artifact
      uses: actions/upload-artifact@v4
      with:
        name: runpod-populate-script
        path: runpod-populate-commands.sh
        retention-days: 7
        
    - name: Generate summary
      run: |
        echo "## 📦 RunPod Volume Population Guide" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Your Volume" >> $GITHUB_STEP_SUMMARY
        echo "- **Volume ID**: ${{ github.event.inputs.volume_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **GCS Bucket**: ${{ env.GCS_BUCKET }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. **Create Pod**: In RunPod console, create any GPU pod" >> $GITHUB_STEP_SUMMARY
        echo "2. **Mount Volume**: Attach volume ${{ github.event.inputs.volume_id }} at `/workspace/models`" >> $GITHUB_STEP_SUMMARY
        echo "3. **Download Script**: Download the artifact with populate commands" >> $GITHUB_STEP_SUMMARY  
        echo "4. **Run Commands**: SSH into pod and execute the script" >> $GITHUB_STEP_SUMMARY
        echo "5. **Stop Pod**: Once complete, stop the pod to save costs" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Result" >> $GITHUB_STEP_SUMMARY
        echo "Your volume will contain all MuseTalk models (~10GB) and be ready for serverless deployment!" >> $GITHUB_STEP_SUMMARY