name: Populate RunPod Volume with Models

on:
  workflow_dispatch:
    inputs:
      volume_id:
        description: 'RunPod Network Volume ID'
        required: true
        type: string
      gpu_type:
        description: 'GPU type for temporary pod'
        required: false
        default: 'NVIDIA A40'
        type: choice
        options:
          - NVIDIA A40
          - NVIDIA RTX A5000
          - NVIDIA RTX A4000
          - NVIDIA RTX 4090
          - NVIDIA RTX 3090
          - NVIDIA RTX 3080

env:
  GCS_BUCKET: talking-head-models

jobs:
  populate-volume:
    name: Download Models to RunPod Volume
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install RunPod Python SDK
      run: |
        pip install runpod
        echo "✅ RunPod SDK installed"
    
    - name: Create temporary pod for data transfer
      id: create-pod
      run: |
        python3 << 'EOF'
        import runpod
        import time
        import os
        
        # Configure RunPod
        runpod.api_key = "${{ secrets.RUNPOD_API_KEY }}"
        
        # Create pod configuration
        pod_config = {
            "name": "model-transfer-${{ github.run_id }}",
            "imageName": "ubuntu:22.04",
            "gpuType": "${{ github.event.inputs.gpu_type }}",
            "containerDiskInGb": 10,
            "volumeInGb": 0,  # Using network volume
            "networkVolumeId": "${{ github.event.inputs.volume_id }}",
            "volumeMountPath": "/workspace/models",
            "ports": "22/tcp",
            "env": [
                {"key": "GCP_CREDENTIALS", "value": "${{ secrets.GCP_CREDENTIALS }}"},
                {"key": "GCS_BUCKET", "value": "${{ env.GCS_BUCKET }}"}
            ]
        }
        
        # Create the pod
        pod = runpod.create_pod(pod_config)
        pod_id = pod['id']
        
        print(f"Created pod: {pod_id}")
        
        # Wait for pod to be running
        print("Waiting for pod to be ready...")
        for i in range(60):  # Wait up to 10 minutes
            pod_status = runpod.get_pod(pod_id)
            if pod_status['desiredStatus'] == 'RUNNING' and pod_status['runtime']:
                ssh_info = pod_status['runtime']['ports'][0]
                print(f"Pod ready! SSH: {ssh_info['publicIp']}:{ssh_info['publicPort']}")
                
                # Save pod info for cleanup
                with open('pod_info.txt', 'w') as f:
                    f.write(f"{pod_id}\n")
                    f.write(f"{ssh_info['publicIp']}:{ssh_info['publicPort']}\n")
                break
            time.sleep(10)
        else:
            raise Exception("Pod failed to start within 10 minutes")
        
        print(f"pod_id={pod_id}")
        EOF
        
        # Read pod ID from Python output
        POD_ID=$(cat pod_info.txt | head -1)
        SSH_INFO=$(cat pod_info.txt | tail -1)
        
        echo "pod_id=${POD_ID}" >> $GITHUB_OUTPUT
        echo "ssh_info=${SSH_INFO}" >> $GITHUB_OUTPUT
    
    - name: Download models to volume
      run: |
        python3 << 'EOF'
        import runpod
        import time
        
        runpod.api_key = "${{ secrets.RUNPOD_API_KEY }}"
        pod_id = "${{ steps.create-pod.outputs.pod_id }}"
        
        # Commands to run in the pod
        commands = """
        # Update and install dependencies
        apt-get update && apt-get install -y curl gnupg lsb-release
        
        # Install Google Cloud SDK
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
        curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
        apt-get update && apt-get install -y google-cloud-cli
        
        # Authenticate with GCP
        echo "$GCP_CREDENTIALS" > /tmp/gcp-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
        rm /tmp/gcp-key.json
        
        # Create directory structure
        mkdir -p /workspace/models/{musetalk,musetalkV15,syncnet,dwpose,face-parse-bisent,sd-vae,whisper}
        
        # Download models from GCS
        echo "Starting model download..."
        gsutil -m -o "GSUtil:parallel_thread_count=10" \\
               -o "GSUtil:parallel_process_count=4" \\
               cp -r gs://$GCS_BUCKET/models/* /workspace/models/
        
        # Verify download
        echo "Download complete! Verifying..."
        ls -lah /workspace/models/
        du -sh /workspace/models/*
        
        # Count files
        find /workspace/models -type f | wc -l
        """
        
        # Execute commands via RunPod API
        print("Executing model download commands...")
        
        # Note: This would require RunPod's exec API or SSH access
        # For now, we'll show the commands that need to be run
        print("Commands to run in pod:")
        print(commands)
        
        EOF
    
    - name: Verify download and cleanup
      if: always()
      run: |
        python3 << 'EOF'
        import runpod
        import time
        
        runpod.api_key = "${{ secrets.RUNPOD_API_KEY }}"
        pod_id = "${{ steps.create-pod.outputs.pod_id }}"
        
        try:
            # Get final status
            pod_status = runpod.get_pod(pod_id)
            print(f"Final pod status: {pod_status.get('desiredStatus', 'UNKNOWN')}")
            
            # Terminate the pod
            print(f"Terminating pod {pod_id}...")
            runpod.terminate_pod(pod_id)
            print("✅ Pod terminated successfully")
            
        except Exception as e:
            print(f"Error during cleanup: {e}")
        EOF
    
    - name: Generate summary
      run: |
        echo "## 📦 RunPod Volume Population Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Volume ID**: ${{ github.event.inputs.volume_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **GPU Type**: ${{ github.event.inputs.gpu_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **GCS Bucket**: ${{ env.GCS_BUCKET }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Pod ID**: ${{ steps.create-pod.outputs.pod_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Verify models are in your volume by creating a pod and checking `/workspace/models`" >> $GITHUB_STEP_SUMMARY
        echo "2. Update your serverless endpoint to mount this volume" >> $GITHUB_STEP_SUMMARY
        echo "3. Models should now load instantly without GCS download" >> $GITHUB_STEP_SUMMARY