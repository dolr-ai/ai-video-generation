name: Build and Push to Google Artifact Registry

on:
  push:
    branches: [ main, talking-head ]
    paths:
      - 'MuseTalk/docker/**'
      - 'MuseTalk/fastapi_server/**'
      - 'MuseTalk/requirements.txt'
      - '.github/workflows/build-push-gar.yml'

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string
  
  workflow_run:
    workflows: ["Download and Upload Models to GCS"]
    types:
      - completed

env:
  # Google Artifact Registry configuration
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: talking-head-registry
  PROJECT_ID: jay-dhanwant-experiments
  IMAGE_NAME: musetalk-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # id-token: write  # Not needed with service account key

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Authenticate to Google Cloud using service account key
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Configure Docker to use gcloud as credential helper
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
    
    - name: Free up disk space
      run: |
        echo "🗑️ Freeing up disk space..."
        # Remove unnecessary tools to free up space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/.ghcup
        
        # Remove unused Docker images
        docker system prune -af --volumes
        
        # Remove unused packages
        sudo apt-get clean
        sudo apt-get autoremove -y
        sudo rm -rf /var/lib/apt/lists/*
        
        # Clear package cache
        sudo apt-get autoclean
        
        # Show available space
        echo "Available disk space after cleanup:"
        df -h
        
    # Models will be downloaded at runtime from GCS, not during build
    # This keeps the Docker image small and allows dynamic model updates
    - name: Skip model download during build
      run: |
        echo "📦 Models will be downloaded at container startup from GCS"
        echo "   This reduces Docker image size from ~10GB to ~2-3GB"
        echo "   Set GCP_CREDENTIALS and GCS_BUCKET environment variables when running the container"

    - name: Generate image metadata
      id: meta
      run: |
        # Generate tag based on branch and commit
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.image_tag }}"
        elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
          TAG="latest"
        else
          TAG="${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}"
        fi

        # Full image URL
        IMAGE_URL="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"

        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "image=${IMAGE_URL}" >> $GITHUB_OUTPUT
        echo "full_image=${IMAGE_URL}:${TAG}" >> $GITHUB_OUTPUT

        # Also tag with commit SHA for traceability
        echo "sha_tag=${IMAGE_URL}:sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

        # Generate build timestamp
        echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./MuseTalk
        file: ./MuseTalk/docker/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.meta.outputs.full_image }}
          ${{ steps.meta.outputs.sha_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ steps.meta.outputs.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.tag }}

    - name: Run security scan
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: ${{ steps.meta.outputs.full_image }}
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'  # Don't fail build on vulnerabilities, just report

    # Push is now handled by the build-push-action above
    - name: Verify image was pushed
      run: |
        echo "✅ Successfully pushed images:"
        echo "  - ${{ steps.meta.outputs.full_image }}"
        echo "  - ${{ steps.meta.outputs.sha_tag }}"
        
        # Verify the image exists in the registry
        gcloud container images describe ${{ steps.meta.outputs.full_image }} || true

    - name: Generate deployment instructions
      run: |
        cat << EOF > deployment-info.txt
        ========================================
        Docker Image Build & Push Successful
        ========================================

        Image Details:
        - Registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        - Project: ${{ env.PROJECT_ID }}
        - Repository: ${{ env.GAR_REPOSITORY }}
        - Image: ${{ env.IMAGE_NAME }}
        - Tag: ${{ steps.meta.outputs.tag }}
        - SHA Tag: sha-${GITHUB_SHA::7}

        Full Image URLs:
        - ${{ steps.meta.outputs.full_image }}
        - ${{ steps.meta.outputs.sha_tag }}

        To pull this image:
        docker pull ${{ steps.meta.outputs.full_image }}

        To deploy:
        1. Use the image URL: ${{ steps.meta.outputs.full_image }}
        2. Set environment variables:
           - GCP_CREDENTIALS: Service account JSON for GCS access
           - GCS_BUCKET: Bucket name containing models (default: talking-head-models)
        3. Models will be downloaded from GCS on first startup (~10GB)
        4. Optional: Mount volumes:
           - /workspace/ai-video-generation/MuseTalk/models for persistent model storage
           - /workspace/ai-video-generation/MuseTalk/fastapi_server/storage for outputs
        5. Configure GPU resources (minimum 16GB VRAM recommended)
        6. Expose ports: 8000 (API), 8001 (Model Server)
        
        Note: This image is lightweight (~2-3GB) as models are downloaded at runtime

        ========================================
        EOF

        cat deployment-info.txt

    - name: Upload deployment info as artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-info-${{ github.sha }}
        path: deployment-info.txt
        retention-days: 30

    - name: Create GitHub Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        body: |
          ## Docker Image

          ```
          ${{ steps.meta.outputs.full_image }}
          ```

          ### Pull Command
          ```bash
          docker pull ${{ steps.meta.outputs.full_image }}
          ```
        files: deployment-info.txt