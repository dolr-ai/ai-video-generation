name: Deploy MuseTalk to Fly.io (Staging)

on:
  # Trigger on push to develop branch
  push:
    branches: [ develop, staging ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy-staging.yml'
  
  # Allow manual deployment
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-staging:
    name: Deploy MuseTalk API (Staging)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master
    
    - name: Create staging app if it doesn't exist
      run: |
        cd MuseTalk
        if ! flyctl apps list | grep -q "musetalk-api-staging"; then
          echo "Creating staging app..."
          flyctl apps create musetalk-api-staging --org personal
        fi
    
    - name: Create staging volumes
      run: |
        cd MuseTalk
        # Use smaller volumes for staging
        if ! flyctl volumes list --app musetalk-api-staging | grep -q "musetalk_models_staging"; then
          flyctl volumes create musetalk_models_staging --size 50 --region ord --app musetalk-api-staging
        fi
        
        if ! flyctl volumes list --app musetalk-api-staging | grep -q "musetalk_storage_staging"; then
          flyctl volumes create musetalk_storage_staging --size 25 --region ord --app musetalk-api-staging
        fi
    
    - name: Update staging config
      run: |
        cd MuseTalk
        # Create staging-specific fly.toml
        cp fly/fly.toml fly/fly-staging.toml
        
        # Update app name and volumes for staging
        sed -i 's/app = .musetalk-api./app = "musetalk-api-staging"/' fly/fly-staging.toml
        sed -i 's/source = "musetalk_models"/source = "musetalk_models_staging"/' fly/fly-staging.toml
        sed -i 's/source = "musetalk_storage"/source = "musetalk_storage_staging"/' fly/fly-staging.toml
    
    - name: Deploy to Fly.io (Staging)
      run: |
        cd MuseTalk
        flyctl deploy --config fly/fly-staging.toml --app musetalk-api-staging --ha=false
    
    - name: Health check (Staging)
      run: |
        sleep 30
        APP_URL=$(flyctl info --app musetalk-api-staging --json | jq -r '.Hostname')
        
        if curl -f -s "https://$APP_URL/api/v1/health"; then
          echo "✅ Staging deployment healthy!"
          echo "Staging URL: https://$APP_URL"
        else
          echo "❌ Staging health check failed"
          exit 1
        fi
    
    - name: Cleanup staging config
      if: always()
      run: |
        rm -f MuseTalk/fly/fly-staging.toml