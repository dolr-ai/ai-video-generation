name: Deploy talking-head to Fly.io

on:
  # Trigger on push to main branch
  push:
    branches: [ talking-head ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy-fly.yml'

  # Allow manual deployment
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy MuseTalk API
    runs-on: ubuntu-latest

    steps:
    - name: Debug Start
      run: |
        echo "=========================================="
        echo "WORKFLOW STARTED SUCCESSFULLY!"
        echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "=========================================="
        date
        whoami
        pwd
        df -h

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (for flyctl)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Download models from GCS
      run: |
        cd MuseTalk
        echo "=========================================="
        echo "Downloading models from GCS..."
        echo "=========================================="

        # Download models from GCS bucket
        echo "Downloading from GCS bucket: ${{ secrets.GCS_BUCKET || 'talking-head-models' }}"
        gsutil -m cp -r gs://${{ secrets.GCS_BUCKET || 'talking-head-models' }}/models .

        # Show downloaded files
        echo "Downloaded models:"
        find models -type f -name "*.pth" -o -name "*.bin" -o -name "*.pt" | head -10
        du -sh models/*

    - name: Deploy to Fly.io
      run: |
        cd MuseTalk
        
        # Ensure app exists
        flyctl apps list | grep -q "talking-head-api" || flyctl apps create talking-head-api --org yral-ds
        
        # Ensure volume exists  
        flyctl volumes list --app talking-head-api | grep -q "musetalk_models" || \
          flyctl volumes create musetalk_models --size 100 --region ord --vm-gpu-kind l40s --app talking-head-api
        
        # Deploy
        flyctl deploy --config fly/fly.toml --dockerfile fly/Dockerfile --app talking-head-api --ha=false --wait-timeout 1800

    - name: Upload models to volume
      run: |
        cd MuseTalk
        
        # Check and upload models if needed
        if ! flyctl ssh console --app talking-head-api -C "test -f /workspace/ai-video-generation/MuseTalk/models/.models_downloaded" 2>/dev/null; then
          flyctl ssh sftp shell --app talking-head-api << 'EOF'
          lcd models
          cd /workspace/ai-video-generation/MuseTalk
          put -r . models
          quit
        EOF
          flyctl ssh console --app talking-head-api -C "touch /workspace/ai-video-generation/MuseTalk/models/.models_downloaded"
        fi
        
        # Cleanup
        rm -rf models/

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 30  # Wait for deployment to complete

        # Get app URL
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        if [ "$APP_URL" != "null" ] && [ ! -z "$APP_URL" ]; then
          echo "App URL: https://$APP_URL"

          # Check health endpoint (retry up to 5 times)
          for i in {1..5}; do
            if curl -f -s "https://$APP_URL/api/v1/health"; then
              echo "Health check passed!"
              break
            else
              echo "Health check attempt $i failed, retrying in 30s..."
              sleep 30
            fi

            if [ $i -eq 5 ]; then
              echo "Health check failed after 5 attempts"
              exit 1
            fi
          done
        else
          echo "Unable to get app URL"
          exit 1
        fi

    - name: Post deployment info
      if: success()
      run: |
        cd MuseTalk
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        echo "=========================================="
        echo "MuseTalk API deployed successfully!"
        echo "=========================================="
        echo "API URL: https://$APP_URL"
        echo "Health: https://$APP_URL/api/v1/health"
        echo "Docs: https://$APP_URL/docs"
        echo ""
        echo "To monitor:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"
        echo "=========================================="

    - name: Notify on failure
      if: failure()
      run: |
        echo "Deployment failed!"
        echo "Check the logs above for details."
        echo "You can also check:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"