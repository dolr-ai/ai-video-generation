name: Deploy talking-head to Fly.io

on:
  # Trigger on push to main branch
  push:
    branches: [ talking-head ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy-fly.yml'

  # Allow manual deployment
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # App configuration
  APP_NAME: talking-head-api
  ORG_NAME: yral-ds
  REGION: ord
  # Volume configuration
  VOLUME_NAME: musetalk_models
  VOLUME_SIZE: 100
  GPU_TYPE: a10  # Must match fly.toml [[vm]] size
  # Paths
  FLY_TOML_PATH: fly/fly.toml
  DOCKERFILE_PATH: fly/Dockerfile

jobs:
  deploy:
    name: Deploy MuseTalk API
    runs-on: ubuntu-latest

    steps:
    - name: Debug Start
      run: |
        echo "=========================================="
        echo "WORKFLOW STARTED SUCCESSFULLY!"
        echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "=========================================="
        date
        whoami
        pwd
        df -h

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (for flyctl)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Download models from GCS
      run: |
        cd MuseTalk
        echo "=========================================="
        echo "Downloading models from GCS..."
        echo "=========================================="

        # Download models from GCS bucket
        echo "Downloading from GCS bucket: ${{ secrets.GCS_BUCKET || 'talking-head-models' }}"
        gsutil -m cp -r gs://${{ secrets.GCS_BUCKET || 'talking-head-models' }}/models .

        # Show downloaded files
        echo "Downloaded models:"
        find models -type f -name "*.pth" -o -name "*.bin" -o -name "*.pt" | head -10
        du -sh models/*

    - name: Deploy to Fly.io
      run: |
        cd MuseTalk
        
        # Create app if doesn't exist
        flyctl apps list | grep -q "$APP_NAME" || flyctl apps create $APP_NAME --org $ORG_NAME
        
        # Create volume if doesn't exist
        flyctl volumes list --app $APP_NAME | grep -q "$VOLUME_NAME" || \
          flyctl volumes create $VOLUME_NAME --size $VOLUME_SIZE --region $REGION --vm-gpu-kind $GPU_TYPE --app $APP_NAME --yes
        
        # Deploy
        flyctl deploy --config $FLY_TOML_PATH --dockerfile $DOCKERFILE_PATH --app $APP_NAME --primary-region $REGION --ha=false --wait-timeout 1800

    - name: Upload models to volume
      run: |
        cd MuseTalk
        
        # Ensure machine is running
        echo "Ensuring machine is running..."
        flyctl scale count 1 --app $APP_NAME
        sleep 300  # Wait 5 minutes for machine to fully start
        
        # Check machine status
        flyctl machines list --app $APP_NAME
        
        # Upload models to volume
        echo "Checking if models already exist in volume..."
        if flyctl ssh console --app $APP_NAME -C "ls -la /workspace/ai-video-generation/MuseTalk/models/ | grep -q 'musetalkV15'" 2>/dev/null; then
          echo "Models already exist in volume, skipping upload"
        else
          echo "Models not found in volume, uploading..."
          echo "Creating models directory if it doesn't exist..."
          flyctl ssh console --app $APP_NAME -C "mkdir -p /workspace/ai-video-generation/MuseTalk/models"
          
          echo "Uploading models (this may take several minutes)..."
          # Use tar with -C flag to change directory instead of using cd
          tar -czf - models | flyctl ssh console --app $APP_NAME -C "tar -xzf - -C /workspace/ai-video-generation/MuseTalk --no-same-owner --no-same-permissions"
          
          # Verify upload was successful
          echo "Verifying model upload..."
          flyctl ssh console --app $APP_NAME -C "ls -la /workspace/ai-video-generation/MuseTalk/models/"
          
          # Create marker file
          flyctl ssh console --app $APP_NAME -C "touch /workspace/ai-video-generation/MuseTalk/models/.models_downloaded"
          
          echo "Model upload completed"
        fi
        
        # Verify models are accessible
        echo "Final verification of models..."
        flyctl ssh console --app $APP_NAME -C "find /workspace/ai-video-generation/MuseTalk/models -type f -name '*.pth' 2>/dev/null | head -5 || echo 'No .pth files found yet'"
        
        # Cleanup local models
        rm -rf models/

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 30  # Wait for deployment to complete

        # Get app URL
        APP_URL=$(flyctl info --app $APP_NAME --json | jq -r '.Hostname')
        
        if [ "$APP_URL" != "null" ] && [ ! -z "$APP_URL" ]; then
          echo "App URL: https://$APP_URL"
          curl -f -s "https://$APP_URL/api/v1/health" || echo "Health check failed but continuing"
        fi

