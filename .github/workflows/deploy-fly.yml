name: Deploy talking-head to Fly.io

on:
  # Trigger on push to main branch
  push:
    branches: [ talking-head ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy.yml'

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy MuseTalk API
    # Using larger GitHub-hosted runner with more resources
    # Options: ubuntu-latest-4-cores (16GB RAM), ubuntu-latest-8-cores (32GB RAM), ubuntu-latest-16-cores (64GB RAM)
    runs-on: ubuntu-latest-8-cores  # 8 vCPUs, 32GB RAM, 300GB SSD storage

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (for flyctl)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Create persistent volumes with GPU constraints
      run: |
        cd MuseTalk
        echo "Creating GPU-enabled volumes if they don't exist..."
        
        # Check and create models volume with GPU constraint
        if ! flyctl volumes list --app talking-head-api | grep -q "musetalk_models"; then
          echo "Creating models volume (100GB) with L40S GPU constraint..."
          flyctl volumes create musetalk_models \
            --size 100 \
            --region ord \
            --vm-gpu-kind l40s \
            --app talking-head-api || echo "Volume creation failed, may already exist"
        else
          echo "Models volume already exists"
        fi
        
        # Check and create storage volume with GPU constraint  
        if ! flyctl volumes list --app talking-head-api | grep -q "musetalk_storage"; then
          echo "Creating storage volume (50GB) with L40S GPU constraint..."
          flyctl volumes create musetalk_storage \
            --size 50 \
            --region ord \
            --vm-gpu-kind l40s \
            --app talking-head-api || echo "Volume creation failed, may already exist"
        else
          echo "Storage volume already exists"
        fi

    - name: Deploy to Fly.io
      run: |
        cd MuseTalk
        echo "Deploying MuseTalk to Fly.io..."
        # Increased timeout to 30 minutes for model downloads and startup
        flyctl deploy --config fly/fly.toml --app talking-head-api --ha=false --wait-timeout 1800

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 30  # Wait for deployment to complete

        # Get app URL
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        if [ "$APP_URL" != "null" ] && [ ! -z "$APP_URL" ]; then
          echo "App URL: https://$APP_URL"

          # Check health endpoint (retry up to 5 times)
          for i in {1..5}; do
            if curl -f -s "https://$APP_URL/api/v1/health"; then
              echo "✅ Health check passed!"
              break
            else
              echo "Health check attempt $i failed, retrying in 30s..."
              sleep 30
            fi

            if [ $i -eq 5 ]; then
              echo "❌ Health check failed after 5 attempts"
              exit 1
            fi
          done
        else
          echo "Unable to get app URL"
          exit 1
        fi

    - name: Post deployment info
      if: success()
      run: |
        cd MuseTalk
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        echo "=========================================="
        echo "🚀 MuseTalk API deployed successfully!"
        echo "=========================================="
        echo "API URL: https://$APP_URL"
        echo "Health: https://$APP_URL/api/v1/health"
        echo "Docs: https://$APP_URL/docs"
        echo ""
        echo "To monitor:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"
        echo "=========================================="

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo "You can also check:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"