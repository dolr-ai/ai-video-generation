name: Deploy talking-head to Fly.io

on:
  # Trigger on push to main branch
  push:
    branches: [ talking-head ]
    paths:
      - 'MuseTalk/**'
      - '.github/workflows/deploy.yml'

  # Allow manual deployment
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy MuseTalk API
    # Using larger GitHub-hosted runner with more resources
    # Options: ubuntu-latest-4-cores (16GB RAM), ubuntu-latest-8-cores (32GB RAM), ubuntu-latest-16-cores (64GB RAM)
    runs-on: ubuntu-latest-8-cores  # 8 vCPUs, 32GB RAM, 300GB SSD storage

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (for flyctl)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Download models from GCS
      run: |
        cd MuseTalk
        echo "=========================================="
        echo "📥 Downloading models from GCS..."
        echo "=========================================="
        
        # Download models from GCS bucket
        echo "Downloading from GCS bucket: ${{ secrets.GCS_BUCKET || 'talking-head-models' }}"
        gsutil -m cp -r gs://${{ secrets.GCS_BUCKET || 'talking-head-models' }}/models .
        
        # Show downloaded files
        echo "Downloaded models:"
        find models -type f -name "*.pth" -o -name "*.bin" -o -name "*.pt" | head -10
        du -sh models/*

    - name: Create persistent volumes with GPU constraints
      run: |
        cd MuseTalk
        echo "Creating GPU-enabled volumes if they don't exist..."
        
        # Check and create models volume with GPU constraint
        if ! flyctl volumes list --app talking-head-api | grep -q "musetalk_models"; then
          echo "Creating models volume (100GB) with L40S GPU constraint..."
          flyctl volumes create musetalk_models \
            --size 100 \
            --region ord \
            --vm-gpu-kind l40s \
            --app talking-head-api || echo "Volume creation failed, may already exist"
        else
          echo "Models volume already exists"
        fi
        
        # Check and create storage volume with GPU constraint  
        if ! flyctl volumes list --app talking-head-api | grep -q "musetalk_storage"; then
          echo "Creating storage volume (50GB) with L40S GPU constraint..."
          flyctl volumes create musetalk_storage \
            --size 50 \
            --region ord \
            --vm-gpu-kind l40s \
            --app talking-head-api || echo "Volume creation failed, may already exist"
        else
          echo "Storage volume already exists"
        fi

    - name: Deploy to Fly.io
      run: |
        cd MuseTalk
        echo "Deploying MuseTalk to Fly.io..."
        # Increased timeout to 30 minutes for model downloads and startup
        flyctl deploy --config fly/fly.toml --app talking-head-api --ha=false --wait-timeout 1800

    - name: Upload models to Fly.io volume
      run: |
        cd MuseTalk
        echo "=========================================="
        echo "📤 Uploading models to Fly.io volume..."
        echo "=========================================="
        
        # Check if models already exist in volume
        echo "Checking if models already exist..."
        MODELS_EXIST=$(flyctl ssh console --app talking-head-api -C "test -f /workspace/ai-video-generation/MuseTalk/models/.models_downloaded && echo 'exists' || echo 'missing'" 2>/dev/null || echo 'missing')
        
        if [ "$MODELS_EXIST" = "exists" ]; then
          echo "✅ Models already exist in volume, skipping upload"
        else
          echo "📦 Uploading models directly to persistent volume..."
          
          # Upload entire models directory using sftp
          flyctl ssh sftp shell --app talking-head-api << 'EOF'
          lcd models
          cd /workspace/ai-video-generation/MuseTalk
          put -r . models
          quit
        EOF
          
          # Create marker file
          flyctl ssh console --app talking-head-api -C "touch /workspace/ai-video-generation/MuseTalk/models/.models_downloaded"
          
          # Verify upload
          echo "Verifying models in volume:"
          flyctl ssh console --app talking-head-api -C "find /workspace/ai-video-generation/MuseTalk/models -type f -name '*.pth' -o -name '*.bin' -o -name '*.pt' | head -10"
          
          echo "✅ Models uploaded successfully to persistent volume!"
        fi
        
        # Show final volume usage
        echo "Final volume disk usage:"
        flyctl ssh console --app talking-head-api -C "df -h /workspace/ai-video-generation/MuseTalk/models/ 2>/dev/null || df -h /"

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 30  # Wait for deployment to complete

        # Get app URL
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        if [ "$APP_URL" != "null" ] && [ ! -z "$APP_URL" ]; then
          echo "App URL: https://$APP_URL"

          # Check health endpoint (retry up to 5 times)
          for i in {1..5}; do
            if curl -f -s "https://$APP_URL/api/v1/health"; then
              echo "✅ Health check passed!"
              break
            else
              echo "Health check attempt $i failed, retrying in 30s..."
              sleep 30
            fi

            if [ $i -eq 5 ]; then
              echo "❌ Health check failed after 5 attempts"
              exit 1
            fi
          done
        else
          echo "Unable to get app URL"
          exit 1
        fi

    - name: Post deployment info
      if: success()
      run: |
        cd MuseTalk
        APP_URL=$(flyctl info --app talking-head-api --json | jq -r '.Hostname')

        echo "=========================================="
        echo "🚀 MuseTalk API deployed successfully!"
        echo "=========================================="
        echo "API URL: https://$APP_URL"
        echo "Health: https://$APP_URL/api/v1/health"
        echo "Docs: https://$APP_URL/docs"
        echo ""
        echo "To monitor:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"
        echo "=========================================="

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs above for details."
        echo "You can also check:"
        echo "  flyctl logs --app talking-head-api"
        echo "  flyctl status --app talking-head-api"